<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 280px; padding: 16px; margin: 0; }
    h2 { margin-top: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .status { margin-bottom: 16px; font-size: 14px; padding: 10px; border-radius: 8px; background: #f1f5f9; }
    .active-badge { color: #059669; font-weight: bold; }
    .inactive-badge { color: #64748b; font-weight: bold; }
    button { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-disable { background: #ef4444; color: white; }
    .btn-enable { background: #3b82f6; color: white; }
    .footer { margin-top: 16px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <h2>🛡️ Integrity Companion</h2>
  <div class="status">
    Status: <span id="statusText">Checking...</span>
  </div>
  <button id="toggleBtn">Loading...</button>
  <div class="footer">
    This extension monitors tab switches and window blurs only when enabled to enhance your coding practice integrity.
  </div>
  <script src="popup.js"></script>
</body>
</html>
